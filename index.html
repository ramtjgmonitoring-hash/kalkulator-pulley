<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Pulley SPM - SRP</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">
    <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-lg p-6 md:p-8">
        <h1 class="text-2xl md:text-3xl font-bold text-gray-800 border-b pb-4 mb-6">Kalkulator Diameter Pulley Motor – Sucker Rod Pump</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Bagian Input -->
            <div class="bg-blue-50 p-6 rounded-lg border border-blue-100">
                <h2 class="text-xl font-semibold text-blue-800 mb-4">Parameter Input</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Gear Reducer Ratio</label>
                        <input type="number" id="gearRatio" value="28.45" min="0" step="0.01" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500" oninput="calculate()">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Pulley Gearbox (inch)</label>
                        <input type="number" id="pulleyGearbox" value="25" min="0" step="0.1" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500" oninput="calculate()">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">SPM Target</label>
                        <input type="number" id="spmTarget" value="7" min="0" step="0.1" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500" oninput="calculate()">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">RPM Motor</label>
                        <input type="number" id="rpmMotor" value="965" min="0" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500" oninput="calculate()">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Kelipatan Pulley Standar (inch)</label>
                        <input type="number" id="kelipatanPulley" value="0.25" min="0" step="0.05" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500" oninput="calculate()">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Diameter Shaft Motor (inch)</label>
                        <input type="number" id="diaShaft" value="2.125" min="0" step="0.125" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500" oninput="calculate()">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Bore Pulley Baru (inch) <span class="text-xs text-gray-500 italic">- Opsional</span></label>
                        <input type="number" id="borePulley" value="2.125" min="0" step="0.125" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500" oninput="calculate()">
                    </div>
                </div>
            </div>

            <!-- Bagian Hasil -->
            <div class="bg-green-50 p-6 rounded-lg border border-green-100">
                <h2 class="text-xl font-semibold text-green-800 mb-4">Hasil Otomatis</h2>
                <div class="space-y-5">
                    <div class="flex justify-between items-center border-b border-green-200 pb-2">
                        <span class="text-gray-700">Pulley Motor Teoritis (inch):</span>
                        <span id="outTeoritis" class="font-bold text-lg text-gray-900">0.000</span>
                    </div>
                    <div class="flex justify-between items-center border-b border-green-200 pb-2">
                        <span class="text-gray-700">Pulley Motor Standar (inch):</span>
                        <span id="outStandar" class="font-bold text-2xl text-blue-600">0.00</span>
                    </div>
                    <div class="flex justify-between items-center border-b border-green-200 pb-2">
                        <span class="text-gray-700">Estimasi SPM Aktual:</span>
                        <span id="outSpmAktual" class="font-bold text-lg text-gray-900">0.000</span>
                    </div>
                    <div class="flex justify-between items-center border-b border-green-200 pb-2">
                        <span class="text-gray-700">Selisih & Deviasi SPM:</span>
                        <span id="outDeviasi" class="font-bold text-lg text-gray-900">0.000 (0.00%)</span>
                    </div>
                    <div class="flex justify-between items-center border-b border-green-200 pb-2">
                        <span class="text-gray-700">Status Bore/Bushing:</span>
                        <span id="outStatus" class="font-bold text-sm md:text-base px-3 py-1 rounded">SESUAI</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function calculate() {
            const gearRatio = parseFloat(document.getElementById('gearRatio').value) || 0;
            const pulleyGearbox = parseFloat(document.getElementById('pulleyGearbox').value) || 0;
            const spmTarget = parseFloat(document.getElementById('spmTarget').value) || 0;
            const rpmMotor = parseFloat(document.getElementById('rpmMotor').value) || 0;
            const kelipatan = parseFloat(document.getElementById('kelipatanPulley').value) || 0.25;
            const diaShaft = parseFloat(document.getElementById('diaShaft').value) || 0;
            const borePulley = document.getElementById('borePulley').value;

            // Pulley teoritis = B5 * B6 * B7 / B8 (Sesuai urutan variabel: Ratio * PulleyGB * SPM / RPM)
            let teoritis = 0;
            if (rpmMotor > 0) teoritis = (gearRatio * pulleyGearbox * spmTarget) / rpmMotor;
            
            // Pulley standar
            let standar = 0;
            if (kelipatan > 0) standar = Math.round(teoritis / kelipatan) * kelipatan;

            // SPM Aktual
            let spmAktual = 0;
            if (gearRatio > 0 && pulleyGearbox > 0) spmAktual = (rpmMotor * standar) / (gearRatio * pulleyGearbox);

            // Selisih & Deviasi
            const selisih = spmAktual - spmTarget;
            let deviasi = 0;
            if (spmTarget > 0) deviasi = (selisih / spmTarget) * 100;

            // Status Bore
            let statusText = "BELUM DIISI";
            let statusClass = "bg-gray-200 text-gray-800";
            
            if (borePulley !== "") {
                const boreVal = parseFloat(borePulley);
                if (boreVal.toFixed(3) === diaShaft.toFixed(3)) {
                    statusText = "SESUAI";
                    statusClass = "bg-green-500 text-white";
                } else {
                    statusText = "PERIKSA BORE/BUSHING";
                    statusClass = "bg-red-500 text-white";
                }
            }

            // Tampilkan hasil
            document.getElementById('outTeoritis').innerText = teoritis.toFixed(3);
            document.getElementById('outStandar').innerText = standar.toFixed(2);
            document.getElementById('outSpmAktual').innerText = spmAktual.toFixed(3);
            document.getElementById('outDeviasi').innerText = `${selisih > 0 ? '+' : ''}${selisih.toFixed(3)} (${selisih > 0 ? '+' : ''}${deviasi.toFixed(2)}%)`;
            
            const statusEl = document.getElementById('outStatus');
            statusEl.innerText = statusText;
            statusEl.className = `font-bold text-sm md:text-base px-3 py-1 rounded tracking-wide shadow-sm ${statusClass}`;
        }

        window.onload = calculate;
    </script>
</body>
</html>
